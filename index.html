<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ELPRO — El'Haq Academic & Skills Platform</title>
  <meta name="description" content="ELPRO: ruang belajar modul, tugas, dan kuis dalam satu tempat.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <section class="auth-hero">
    <div class="brand"><span class="logo">E</span><span>ELPRO</span></div>
    <div>
      <h1>Belajar terarah,<br>tumbuh bersama.</h1>
      <p>El'Haq Academic &amp; Skills Platform — modul, tugas, dan kuis dalam satu ruang belajar yang rapi.</p>
    </div>
    <small>&copy; <span id="yr"></span> ELPRO</small>
  </section>

  <main class="auth-panel">
    <div class="auth-card">
      <h2>Selamat datang</h2>
      <p>Masuk untuk melanjutkan belajar.</p>
      <div class="tabs">
        <button type="button" class="on" data-tab="login">Masuk</button>
        <button type="button" data-tab="register">Daftar</button>
      </div>

      <form id="login">
        <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>
        <label class="field"><span>Kata sandi</span><input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn primary">Masuk</button>
        <button type="button" class="link-btn" id="forgot">Lupa kata sandi?</button>
      </form>

      <form id="register" hidden>
        <label class="field"><span>Nama lengkap</span><input name="name" autocomplete="name" required></label>
        <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>
        <label class="field"><span>Kata sandi</span><input name="password" type="password" minlength="6" autocomplete="new-password" required><small>Minimal 6 karakter.</small></label>
        <label class="field"><span>Ulangi kata sandi</span><input name="confirm" type="password" minlength="6" autocomplete="new-password" required></label>
        <button class="btn primary">Buat akun siswa</button>
      </form>

      <p id="msg" class="msg"></p>
    </div>
  </main>
  <script>document.getElementById("yr").textContent = new Date().getFullYear();</script>
  <script type="module" src="js/index.js"></script>
</body>
</html>
